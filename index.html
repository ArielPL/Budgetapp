<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaff" />
    <meta name="description" content="Din personliga månadsbudget" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Budget" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Budget – Månadsbudget</title>
    <script>
      // Light or dark before the first paint, so a light theme does not flash
      // dark while the app loads. Light unless a dark one is stored; main.tsx
      // then applies the full theme. (In the iOS and Android apps the store
      // is the database, not readable here, so this is only a first guess.)
      try {
        var m = localStorage.getItem('budget_theme_mode') || (localStorage.getItem('budget_theme') === 'dark' ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', m === 'dark' ? 'dark' : 'light');
      } catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    </script>
    <script>
      if ('serviceWorker' in navigator && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js');
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
